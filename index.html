<html lang="pt-BR">

<style>

  label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 .25rem;font-weight:600}

  .total{background:var(--pri2);color:var(--pri);border-radius:9px;padding:.6rem .8rem;font-weight:600}

  .info div span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
  .aviso{border-radius:9px;padding:.65rem .8rem;margin-bottom:.8rem}
  .aviso.err{background:var(--err2);color:var(--err)}
  .aviso.warn{background:var(--warn2);color:var(--warn)}

  .login{width:100%;max-width:380px}
  .login .marca{color:var(--pri);font-size:1.4rem;margin-bottom:.2rem}
  .linha{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--linha)}

  .linha select{width:auto;min-height:36px;padding:.3rem .5rem}
  .vazio{text-align:center;color:var(--muted);padding:2rem 1rem}

  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;align-items:center;justify-content:center;padding:1rem}
  #lightbox img{max-width:100%;max-height:100%;border-radius:6px}
  #print-area{display:none}
  @media print{
    body{background:#fff}
    #app,#toast,#lightbox{display:none!important}
    #print-area{display:block;font-size:11pt;color:#000}
    #print-area h1{font-size:16pt} #print-area h2{font-size:13pt;margin-top:1rem}

    @page{margin:14mm}
  }
</style>

const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

  const linhas = txt.replace(/\r/g, '').split('\n')
    // tira o prefixo que o WhatsApp põe ao copiar várias mensagens: "[03/11/2026 17:09] Fulano: " ou "03/11/2026 17:09 - Fulano: "

  for (const l of linhas) {
    if (norm(l.replace(/\*/g, '')) === 'diario de obra') { atual = []; blocos.push(atual); continue; }
    if (!atual) { atual = []; blocos.push(atual); }
    atual.push(l);
  }
  return blocos.map(lerBloco).filter(b => b._ok);
}

function lerHoras(txt){
  const out = []; const re = /(\d{1,2})\s*(?::|h)\s*(\d{2})?/gi; let m;
  while ((m = re.exec(txt))) { const h = +m[1], mi = +(m[2] || 0); if (h < 24 && mi < 60) out.push(`${pad2(h)}:${pad2(mi)}`); }
  if (out.length < 2) { const m2 = txt.match(/(\d{1,2})\s*(?:a|as|às|à|-|ate|até)\s*(\d{1,2})\b/i); if (m2) return [`${pad2(+m2[1])}:00`, `${pad2(+m2[2])}:00`]; }
  return out;
}

  if (/hoje/i.test(txt)) return hoje();
  const m = txt.match(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/); if (!m) return null;
  let a = m[3] ? +m[3] : new Date().getFullYear(); if (a < 100) a += 2000;
  if (+m[2] < 1 || +m[2] > 12 || +m[1] < 1 || +m[1] > 31) return null;
  return `${a}-${pad2(+m[2])}-${pad2(+m[1])}`;
}

  if (!txt || /^(nenhum|nao|n\/a|-|sem material|nada)\.?$/i.test(norm(txt))) return [];
  const itens = [];
  for (const linha of txt.split('\n')) {

      p = p.replace(/^\s*(e|-|•|\*)\s+/i, '').replace(/[.,;]\s*$/, '').trim();
      if (!p) continue;
      const m = p.match(/^(\d+(?:[.,]\d+)?)\s*(m|mt|mts|metros?|cx|caixas?|pct|pcts|pacotes?|rolos?|kg|l|litros?|un|und|unid|unidades?|p[çc]s?|pe[çc]as?)?\.?\s+(?:de\s+)?(.+)$/i);
      if (!m) { itens.push({ quantidade:'', unidade:'un', descricao:p }); continue; }
      const unidade = m[2] ? (UNI_MAP.find(([re]) => re.test(m[2])) || [, 'un'])[1] : 'un';
      let descricao = m[3].trim();
      // "50 patch cord 2m. E 25 de 1m" -> o segundo vira "patch cord 1m"
      const ant = itens[itens.length - 1], soMedida = /^\d+(?:[.,]\d+)?\s*m$/i;
      if (soMedida.test(descricao) && ant && /\d+(?:[.,]\d+)?\s*m\b/i.test(ant.descricao))
        descricao = ant.descricao.replace(/\d+(?:[.,]\d+)?\s*m\b/i, descricao.replace(/\s+/g, ''));
      itens.push({ quantidade: m[1].replace(',', '.'), unidade, descricao });
    }
  }
  return itens;
}
function acharCliente(nome){
  const n = norm(nome); if (!n) return null;
  return S.clientes.find(c => norm(c.nome) === n) || S.clientes.find(c => norm(c.nome).includes(n) || n.includes(norm(c.nome))) || null;
}
function acharTecnico(nome){
  const n = norm(nome); if (!n) return null;
  return S.tecnicos.find(t => norm(t.nome) === n) || S.tecnicos.find(t => norm(t.nome).split(' ')[0] === n.split(' ')[0]) || null;
}
function lerBloco(linhas){
  const r = {}; let atual = null;
  for (const bruta of linhas) {
    const l = bruta.replace(/\*/g, '').trim();
    if (!l) continue;
    const m = l.match(/^([^:]{2,30}):\s*(.*)$/), k = m && qualChave(m[1]);
    if (k) { atual = k; r[k] = [r[k], m[2]].filter(Boolean).join('\n'); continue; }
    if (atual) r[atual] = [r[atual], l].filter(Boolean).join('\n');
  }
  const d = { _ok: Object.keys(r).length >= 2, _avisos: [], _clienteNovo: null, _tecnicosNovos: [], _tecnicos: [], _materiais: [], _fotos: [] };
  d.data = r.data ? lerData(r.data) : null;
  if (r.data && !d.data) d._avisos.push(`Data não reconhecida: "${r.data}"`);
  if (!r.data) d._avisos.push('A mensagem não tinha data. Usei a de hoje.');
  if (r.cliente) {
    const c = acharCliente(r.cliente);
    if (c) d.cliente_id = c.id; else d._clienteNovo = r.cliente.trim();
  }
  if (r.tecnicos) for (const nome of r.tecnicos.split(/,|;|\/|&|\+|\s+e\s+/i).map(s => s.trim()).filter(Boolean)) {
    const t = acharTecnico(nome); if (t) d._tecnicos.push(t.id); else d._tecnicosNovos.push(nome);
  }
  const h = r.horario ? lerHoras(r.horario) : [];
  [d.hora_inicio, d.hora_fim] = h;
  if (r.horario && h.length < 2) d._avisos.push(`Horário não reconhecido: "${r.horario}"`);
  if (r.intervalo && !/^(nao|sem|nenhum|-)/.test(norm(r.intervalo))) {
    const i = lerHoras(r.intervalo);
    if (i.length >= 2) [d.intervalo_inicio, d.intervalo_fim] = i; else d._avisos.push(`Intervalo não reconhecido: "${r.intervalo}". Preencha à mão.`);
  }
  if (r.km) { const k = r.km.match(/(\d+(?:[.,]\d+)?)/); if (k) d.km = Number(k[1].replace(',', '.')); else d._avisos.push(`KM não reconhecido: "${r.km}"`); }
  if (!r.cliente || !r.cliente.trim()) d._avisos.push('A mensagem não informa o cliente.');
  if (!r.tecnicos || !r.tecnicos.trim()) d._avisos.push('A mensagem não informa os técnicos.');
  d.servico = (r.servico || '').trim();
  d.observacoes = (r.obs || '').trim() || null;
  d._materiais = lerMateriais(r.material);
  if (d._materiais.some(m => !m.quantidade)) d._avisos.push('Algum material ficou sem quantidade. Confira a lista.');
  return d;
}

      m._q = qn;
    }
    const btn = $('#salvar'), prog = $('#progresso'); btn.disabled = true;
    try {
      prog.textContent = 'Salvando diário…';
      let id;
      if (ed) { await q(sb.from('diarios').update(d).eq('id', diario.id)); id = diario.id;
        await q(sb.from('diario_tecnicos').delete().eq('diario_id', id));
        await q(sb.from('materiais').delete().eq('diario_id', id));
      } else id = (await q(sb.from('diarios').insert(d).select('id').single())).id;
      await q(sb.from('diario_tecnicos').insert([...tecSel].map(t => ({ diario_id:id, tecnico_id:t }))));
      if (mats.length) await q(sb.from('materiais').insert(mats.map(m => ({ diario_id:id, quantidade:m._q, unidade:m.unidade, descricao:String(m.descricao).trim() }))));
      if (fotosRemovidas.length) {
        await sb.storage.from('fotos').remove(fotosRemovidas.map(x => x.caminho));
        await q(sb.from('fotos').delete().in('id', fotosRemovidas.map(x => x.id)));
      }
      let i = 0;
      for (const fn of fotosNovas) {
        prog.textContent = `Enviando foto ${++i} de ${fotosNovas.length}…`;
        const blob = await comprimir(fn.file);
        const ext = blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : 'jpg';
        const caminho = `${id}/${crypto.randomUUID()}.${ext}`;
        const { error } = await sb.storage.from('fotos').upload(caminho, blob, { contentType: blob.type || 'image/jpeg' });
        if (error) throw error;
        await q(sb.from('fotos').insert({ diario_id:id, caminho }));
      }
      atualizarContador();
      if (!ed && S.fila?.length) { toast(`Diário salvo. Faltam ${S.fila.length}.`); return irPara('novo', null, S.fila.shift()); }
      S.fila = [];
      toast(ed ? 'Diário atualizado.' : 'Diário salvo!');
      irPara('detalhe', id);
    } catch (e) { falha(e); btn.disabled = false; prog.textContent = ''; }
  };
}

async function comprimir(file){
  try {
    const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch { return file; }
}

      `<div class="vazio">${admin ? 'Nenhum diário com esses filtros.' : 'Você ainda não tem diários.'}</div>`;
    $$('#lista [data-id]').forEach(b => b.onclick = () => irPara('detalhe', +b.dataset.id));
  };
  await carregar();
}
async function buscarDiarios(F, limite = 300){
  let qy = sb.from('vw_diarios').select('*').order('data', { ascending:false }).order('id', { ascending:false }).limit(limite);
  if (F.cliente) qy = qy.eq('cliente_id', F.cliente);
  if (F.status) qy = qy.eq('status', F.status);
  if (F.cobranca === 'a_cobrar') qy = qy.eq('cobrado', false);
  if (F.cobranca === 'cobrado') qy = qy.eq('cobrado', true);
  if (F.de) qy = qy.gte('data', F.de);
  if (F.ate) qy = qy.lte('data', F.ate);
  if (F.tecnico) {
    const ids = (await q(sb.from('diario_tecnicos').select('diario_id').eq('tecnico_id', F.tecnico))).map(x => x.diario_id);
    if (!ids.length) return [];
    qy = qy.in('id', ids);
  }
  return q(qy);
}

async function carregarDiario(id){
  const [d, mats, tecs, fotos] = await Promise.all([
    q(sb.from('vw_diarios').select('*').eq('id', id).single()),
    q(sb.from('materiais').select('*').eq('diario_id', id).order('id')),
    q(sb.from('diario_tecnicos').select('tecnico_id').eq('diario_id', id)),
    q(sb.from('fotos').select('*').eq('diario_id', id).order('id')),
  ]);
  if (fotos.length) {
    const { data } = await sb.storage.from('fotos').createSignedUrls(fotos.map(x => x.caminho), 3600);
    fotos.forEach((x, i) => x.url = data?.[i]?.signedUrl);
  }
  d._materiais = mats; d._tecnicos = tecs.map(t => t.tecnico_id); d._fotos = fotos;
  return d;
}

  c.innerHTML = `

      <div><label>Cliente</label><select name="cliente"><option value="">Todos</option>${S.clientes.map(x => `<option value="${x.id}" ${R.cliente == x.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>

      <div><label>Cobrança</label><select name="cobranca"><option value="a_cobrar" ${R.cobranca === 'a_cobrar' ? 'selected' : ''}>A cobrar</option><option value="cobrado" ${R.cobranca === 'cobrado' ? 'selected' : ''}>Cobrados</option><option value="" ${R.cobranca === '' ? 'selected' : ''}>Todos</option></select></div>
      <div><label>De</label><input type="date" name="de" value="${R.de}"></div>
      <div><label>Até</label><input type="date" name="ate" value="${R.ate}"></div>
    </div>
    <div id="res"><div class="vazio">Carregando…</div></div>`;

  let rows = [];
  const carregar = async () => {
    rows = await buscarDiarios(R, 5000);
    const grupos = agrupar(rows);
    const tot = grupos.reduce((a, g) => ({ n:a.n+g.n, min:a.min+g.min, hm:a.hm+g.hm, km:a.km+g.km }), { n:0, min:0, hm:0, km:0 });
    const cobraveis = rows.filter(d => d.status === 'aprovado' && !d.cobrado);
    $('#res').innerHTML = !rows.length ? '<div class="vazio">Nenhum diário com esses filtros.</div>' : `
      <div class="card"><h3>Resumo por cliente</h3><div class="tabela"><table>
        <thead><tr><th>Cliente</th><th class="n">Diários</th><th class="n">Horas</th><th class="n">Homem-hora</th><th class="n">KM</th></tr></thead>
        <tbody>${grupos.map(g => `<tr><td>${esc(g.nome)}</td><td class="n">${g.n}</td><td class="n">${fmtMin(g.min)}</td><td class="n">${fmtMin(g.hm)}</td><td class="n">${fmtKm(g.km)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="n">${tot.n}</td><td class="n">${fmtMin(tot.min)}</td><td class="n">${fmtMin(tot.hm)}</td><td class="n">${fmtKm(tot.km)}</td></tr></tfoot>
      </table></div>
      <div class="acoes" style="margin-top:1rem">
        <button class="btn" id="xls">Exportar Excel</button>
        <button class="btn" id="pdf">Gerar PDF</button>
        ${cobraveis.length ? `<button class="btn pri" id="cobrar">Marcar ${cobraveis.length} como cobrado${cobraveis.length > 1 ? 's' : ''}</button>` : ''}
      </div></div>
      <div class="card"><h3>Diários</h3><div class="tabela"><table class="larga">
        <thead><tr><th>Data</th><th>Cliente</th><th>Técnicos</th><th class="n">Horas</th><th class="n">H-h</th><th class="n">KM</th><th>Situação</th></tr></thead>
        <tbody>${rows.map(d => `<tr data-id="${d.id}" style="cursor:pointer"><td>${fmtData(d.data)}</td><td>${esc(d.cliente_nome)}</td><td>${esc(d.tecnicos_nomes)}</td><td class="n">${fmtMin(d.minutos_trabalhados)}</td><td class="n">${fmtMin(d.homem_minutos)}</td><td class="n">${d.km != null ? fmtKm(d.km) : '—'}</td><td>${tagStatus(d.status)} ${d.status === 'aprovado' ? tagCobr(d.cobrado) : ''}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
    $$('#res tr[data-id]').forEach(tr => tr.onclick = () => irPara('detalhe', +tr.dataset.id));
    if (!rows.length) return;
    $('#xls').onclick = () => exportarExcel(rows, grupos, tot).catch(falha);
    $('#pdf').onclick = () => imprimirRelatorio(rows, grupos, tot);
    const bc = $('#cobrar');
    if (bc) bc.onclick = async () => {
      if (!confirm(`Marcar ${cobraveis.length} diário(s) aprovado(s) como cobrado(s)?`)) return;
      bc.disabled = true;
      try { await q(sb.from('diarios').update({ cobrado:true }).in('id', cobraveis.map(d => d.id))); toast('Marcados como cobrados.'); carregar(); }
      catch (e) { falha(e); bc.disabled = false; }
    };
  };
  await carregar();
}
function agrupar(rows){
  const m = new Map();
  for (const d of rows) {
    const g = m.get(d.cliente_id) || { nome:d.cliente_nome, n:0, min:0, hm:0, km:0 };
    g.n++; g.min += d.minutos_trabalhados; g.hm += d.homem_minutos; g.km += Number(d.km || 0); m.set(d.cliente_id, g);
  }
  return [...m.values()].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}
function descreverFiltros(){
  const R = S.rel, cli = S.clientes.find(x => x.id == R.cliente);
  return [cli ? `Cliente: ${cli.nome}` : 'Todos os clientes',
    R.status === 'aprovado' ? 'Só aprovados' : 'Todas as situações',
    R.cobranca === 'a_cobrar' ? 'A cobrar' : R.cobranca === 'cobrado' ? 'Cobrados' : 'Cobrados e a cobrar',
    R.de || R.ate ? `Período: ${fmtData(R.de) || 'início'} a ${fmtData(R.ate) || 'hoje'}` : 'Todo o período'].join(' · ');
}
function imprimirRelatorio(rows, grupos, tot){

      <tr><td><b>Total</b></td><td><b>${tot.n}</b></td><td><b>${fmtMin(tot.min)}</b></td><td><b>${fmtMin(tot.hm)}</b></td><td><b>${fmtKm(tot.km)}</b></td></tr></table>
    <h2>Diários</h2>
    <table><tr><th>Data</th><th>Cliente</th><th>Técnicos</th><th>Horário</th><th>Horas</th><th>H-h</th><th>KM</th><th>Serviço</th></tr>
      ${rows.map(d => `<tr><td>${fmtData(d.data)}</td><td>${esc(d.cliente_nome)}</td><td>${esc(d.tecnicos_nomes)}</td><td>${hhmm(d.hora_inicio)}–${hhmm(d.hora_fim)}</td><td>${fmtMin(d.minutos_trabalhados)}</td><td>${fmtMin(d.homem_minutos)}</td><td>${d.km != null ? fmtKm(d.km) : '—'}</td><td>${esc(d.servico)}</td></tr>`).join('')}</table>`);
}
async function carregarScript(src){
  if (window.XLSX) return;
  await new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => erro(new Error('Não foi possível carregar o gerador de Excel.')); document.head.appendChild(s); });
}
async function exportarExcel(rows, grupos, tot){
  toast('Gerando planilha…');
  await carregarScript(XLSX_JS);
  const mats = [];
  const ids = rows.map(d => d.id);
  for (let i = 0; i < ids.length; i += 200) mats.push(...await q(sb.from('materiais').select('*').in('diario_id', ids.slice(i, i+200)).order('diario_id')));
  const porId = new Map(rows.map(d => [d.id, d]));
  const h = m => Math.round(m / 60 * 100) / 100;
  const resumo = [['Cliente','Diários','Horas (h:mm)','Horas (decimal)','Homem-hora (h:mm)','Homem-hora (decimal)','KM'],
    ...grupos.map(g => [g.nome, g.n, fmtMin(g.min), h(g.min), fmtMin(g.hm), h(g.hm), g.km]),
    ['TOTAL', tot.n, fmtMin(tot.min), h(tot.min), fmtMin(tot.hm), h(tot.hm), tot.km], [], [descreverFiltros()]];
  const diarios = [['Nº','Data','Cliente','Técnicos','Início','Fim','Intervalo','Horas (h:mm)','Horas (decimal)','Homem-hora (decimal)','KM','Serviço executado','Observações','Situação','Cobrado','Lançado por'],
    ...rows.map(d => [d.id, fmtData(d.data), d.cliente_nome, d.tecnicos_nomes, hhmm(d.hora_inicio), hhmm(d.hora_fim),
      d.intervalo_inicio ? `${hhmm(d.intervalo_inicio)}–${hhmm(d.intervalo_fim)}` : '', fmtMin(d.minutos_trabalhados), h(d.minutos_trabalhados), h(d.homem_minutos), d.km != null ? Number(d.km) : '',
      d.servico, d.observacoes || '', STATUS[d.status], d.cobrado ? 'Sim' : 'Não', d.criado_por_nome])];
  const materiais = [['Nº diário','Data','Cliente','Qtd.','Un.','Descrição'],
    ...mats.filter(m => porId.has(m.diario_id)).map(m => { const d = porId.get(m.diario_id); return [m.diario_id, fmtData(d.data), d.cliente_nome, Number(m.quantidade), m.unidade, m.descricao]; })];
  const wb = XLSX.utils.book_new();
  const add = (nome, aoa, larg) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = larg.map(w => ({ wch:w })); XLSX.utils.book_append_sheet(wb, ws, nome); };
  add('Resumo', resumo, [28,9,13,14,17,19,9]);
  add('Diários', diarios, [6,11,22,24,7,7,12,12,13,17,8,50,30,11,9,18]);
  add('Materiais', materiais, [10,11,22,8,6,40]);
  XLSX.writeFile(wb, `relatorio-horas-${hoje()}.xlsx`);
}

      <div id="usuarios">${[...pend, ...S.perfis.filter(p => p.ativo)].map(p => `
        <div class="linha" data-u="${p.id}">
          <div><b>${esc(p.nome)}</b>${p.id === S.perfil.id ? ' <span class="muted peq">(você)</span>' : ''}<div class="muted peq">${esc(p.email || '')}</div></div>
          <div class="acoes" style="margin:0;align-items:center">
            <select data-k="papel" ${p.id === S.perfil.id ? 'disabled' : ''}><option value="tecnico" ${p.papel === 'tecnico' ? 'selected' : ''}>Técnico</option><option value="admin" ${p.papel === 'admin' ? 'selected' : ''}>Admin</option></select>
            ${p.id === S.perfil.id ? '' : p.ativo ? `<button class="btn" data-k="ativo" data-v="false">Bloquear</button>` : `<button class="btn ok" data-k="ativo" data-v="true">Liberar</button>`}
          </div>
        </div>`).join('')}</div>
    </div>`;
  $$('#usuarios [data-k]').forEach(el => {
    const salvar = async v => { try { await q(sb.from('perfis').update({ [el.dataset.k]: v }).eq('id', el.closest('[data-u]').dataset.u)); toast('Usuário atualizado.'); irPara('cadastros'); } catch (e) { falha(e); } };
    if (el.tagName === 'SELECT') el.onchange = () => salvar(el.value); else el.onclick = () => salvar(el.dataset.v === 'true');
  });
  const adicionar = (form, tabela, msg) => $(form).onsubmit = async ev => { ev.preventDefault();
    try { await q(sb.from(tabela).insert({ nome: ev.target.nome.value.trim() })); toast(msg); irPara('cadastros'); } catch (e) { falha(e); } };
  adicionar('#nt', 'tecnicos', 'Técnico adicionado.');
  adicionar('#nc', 'clientes', 'Cliente adicionado.');
  const acoes = (sel, attr, tabela, lista, campo) => $$(`${sel} [data-acao]`).forEach(b => b.onclick = async () => {
    const id = +b.closest(`[data-${attr}]`).dataset[attr], x = lista.find(k => k.id === id);
    try {
      if (b.dataset.acao === 'renomear') { const n = prompt('Novo nome:', x.nome); if (!n?.trim()) return; await q(sb.from(tabela).update({ nome:n.trim() }).eq('id', id)); }
      else await q(sb.from(tabela).update({ [campo]: !x[campo] }).eq('id', id));
      toast('Cadastro atualizado.'); irPara('cadastros');
    } catch (e) { falha(e); }
  });
  acoes('#tecnicos', 't', 'tecnicos', S.tecnicos, 'ativo');
  acoes('#clientes', 'c', 'clientes', S.clientes, 'finalizado');
}
</script>

</body>
</html>
